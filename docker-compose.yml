services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo_data:/data/db]
  backend:
    build: ./backend
    env_file: ./backend/.env
    ports: ["8000:8000"]
    depends_on: [mongo]
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: ecovision
    volumes: [./backend/uploads:/app/uploads]
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api/v1
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  mongo_data:
